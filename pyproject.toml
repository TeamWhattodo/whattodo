[project]
name = "whattodo"
version = "0.1.0"
description = "AI 에이전트가 업무 채널을 대신 정리해 주는 복귀 브리핑 서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "streamlit",
    "tinydb",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "authlib",
    "openpyxl",
    "reportlab",
    "python-dotenv",
    "langchain",
    "langchain-anthropic",
    "langchain-openai",
    "langchain-community",
    "chromadb",
    "pypdf",
    "openai>=2.37.0",
    "langchain-mcp-adapters>=0.2.2",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.196.0",
    "langgraph>=1.2.0",
    "slack-sdk>=3.42.0",
    "jira>=3.8.0",
    "notion-client>=2.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
