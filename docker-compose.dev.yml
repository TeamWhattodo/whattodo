services:
  db:
    image: pgvector/pgvector:pg17
    container_name: whattodo-db
    environment:
      POSTGRES_USER: whattodo
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: whattodo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whattodo -d whattodo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
